# iOS のウィジェット(WidgetKit 拡張)。Xcode プロジェクトは XcodeGen で生成する(生成物はコミットしない)。
#   brew install xcodegen
#   xcodegen generate
#   xcodebuild -project WeatherWidget.xcodeproj -target WeatherWidget -configuration Release -sdk iphonesimulator SYMROOT=build CODE_SIGNING_ALLOWED=NO build
# 出力(build/Release-iphonesimulator/WeatherWidget.appex)を MAUI アプリが同梱する(Weather.App.csproj の AdditionalAppExtensions)。
name: WeatherWidget
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  WeatherWidget:
    type: app-extension
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_NAME: WeatherWidget
        # アプリの ApplicationId(Weather.App.csproj)の下に置く
        PRODUCT_BUNDLE_IDENTIFIER: com.weatherapp.soramoyou.WeatherWidget
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: WeatherWidget.entitlements
        # アプリの ApplicationDisplayVersion / ApplicationVersion と一致させる
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
