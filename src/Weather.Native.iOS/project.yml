# iOS の広告・同意・課金のラッパー(Monetization.md「組み込み方」)。Mac で XcodeGen により Xcode プロジェクトを作る。
#   brew install xcodegen && xcodegen generate && ./build.sh
# Google Mobile Ads と UMP は Google 公式の Swift Package を静的にリンクし、この動的フレームワークに含める。
name: WeatherNative
options:
  deploymentTarget:
    iOS: "15.0"
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "12.0.0"
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: "3.0.0"
targets:
  WeatherNative:
    type: framework
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
      - sdk: StoreKit.framework
      - sdk: AppTrackingTransparency.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.alonecraft.soramoyou.native
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        SKIP_INSTALL: NO
        DEFINES_MODULE: YES
        CODE_SIGNING_ALLOWED: NO
