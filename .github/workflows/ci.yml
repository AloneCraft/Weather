# TestStrategy.md「CI」
name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 0 * * 1'   # 週 1 回: 実 API の契約テスト
  workflow_dispatch:

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Test(ライブラリ・ゴールデン画像)
        run: |
          dotnet test --project tests/Weather.Core.Tests
          dotnet test --project tests/Weather.Providers.Tests
          dotnet test --project tests/Weather.Geo.Tests
          dotnet test --project tests/Weather.Scene.Tests
          dotnet test --project tests/Weather.Rendering.Tests
          dotnet test --project tests/Weather.Infrastructure.Tests
          dotnet test --project tests/Weather.Presentation.Tests
          dotnet test --project tests/Weather.Remote.Tests
      - name: Functions(Phase 4)のビルド
        run: dotnet build src/Weather.Functions/Weather.Functions.csproj -warnaserror

  build-android:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      # ワークロードは開発機と同じワークロード セット(iOS 26.5.10301 / Android 36.1.69)に固定する(下の build-ios を参照)
      - run: dotnet workload install maui-android --version 10.0.400
      - run: dotnet build src/Weather.App/Weather.App.csproj -f net10.0-android -warnaserror

  build-ios:
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    # 既定のシェル(bash -e)は pipefail がなく「dotnet build | tee」の失敗を見逃すため、明示して -eo pipefail にする
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      # iOS ワークロード 26.5.10301 は Xcode 26.6 を要求する(2026-10-04 確認)。ランナーには Xcode_26.6.app と Xcode_26.6.0.app があり、
      # 後者は macOS SDK・actool が見つからず失敗したため、前者を名前で選ぶ。なければランナーの既定を使う
      - name: Xcode の選択(iOS ワークロードが要求する 26.6)
        run: |
          ls -d /Applications/Xcode*.app | tr '\n' ' ' | sed 's/^/::notice::Xcode: /'; echo
          if [ -d /Applications/Xcode_26.6.app ]; then sudo xcode-select -s /Applications/Xcode_26.6.app; fi
          echo "::notice::$(xcodebuild -version | tr '\n' ' ') ($(xcode-select -p)) actool: $(xcrun --find actool || echo 'なし')"
      # 復元は App の全 TFM(android / ios)を評価するため android のワークロードも入れる
      # (-p:TargetFrameworks で絞ると参照先のライブラリにも伝わり net10.0 が消えるので使わない)
      # 版を固定しないと最新のワークロード セット(10.0.401.1 = iOS 27.0)が入り、ランナーにない Xcode 27 を要求して失敗する。
      # 開発機と同じ 10.0.400(iOS 26.5.10301。Xcode 26.x)に固定し、上げるときは開発機と CI を同時に上げる
      - run: dotnet workload install maui-ios maui-android --version 10.0.400
      # 失敗時はエラー行を注釈(::error::)にも出す(ログの閲覧にはサインインが必要だが、注釈は公開 API で読める)
      - name: アプリ(シミュレーター向け・署名なし)
        run: |
          dotnet build src/Weather.App/Weather.App.csproj -f net10.0-ios -p:EnableCodeSigning=false 2>&1 | tee build-ios.log || {
            grep -iE "error|failed" build-ios.log | sort -u | head -40 | sed 's/^/::error::/'
            exit 1
          }
      - name: ウィジェット拡張(Swift / WidgetKit)
        working-directory: src/Weather.Widget.iOS
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project WeatherWidget.xcodeproj -target WeatherWidget -configuration Release -sdk iphonesimulator SYMROOT=build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-widget.log || {
            grep -iE "error|failed" build-widget.log | sort -u | head -40 | sed 's/^/::error::/'
            exit 1
          }
      - name: アプリ + ウィジェット拡張
        run: |
          dotnet build src/Weather.App/Weather.App.csproj -f net10.0-ios -p:EnableCodeSigning=false -p:IncludeWidgetExtension=true 2>&1 | tee build-ios-widget.log || {
            grep -iE "error|failed" build-ios-widget.log | sort -u | head -40 | sed 's/^/::error::/'
            exit 1
          }
      # 成果物の確認(.app とウィジェット拡張の同梱)。結果は注釈に出す
      - name: 成果物の確認
        run: |
          app=$(find src/Weather.App/bin -type d -name "Weather.App.app" | head -1)
          if [ -z "$app" ]; then echo "::error::Weather.App.app が見つかりません"; exit 1; fi
          appex="$app/PlugIns/WeatherWidget.appex"
          if [ ! -d "$appex" ]; then echo "::error::ウィジェット拡張が同梱されていません: $appex"; exit 1; fi
          echo "::notice::$(du -sh "$app" | cut -f1) $app / widget $(du -sh "$appex" | cut -f1) / $(plutil -extract CFBundleIdentifier raw "$appex/Info.plist")"
          tail -5 build-ios.log | sed 's/^/::notice::/'
          tail -3 src/Weather.Widget.iOS/build-widget.log | sed 's/^/::notice::/'
          tail -5 build-ios-widget.log | sed 's/^/::notice::/'

  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: 実 API の契約テスト
        run: dotnet test --project tests/Weather.Providers.LiveTests -- --explicit only
