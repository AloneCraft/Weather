# TestStrategy.md「CI」
name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 0 * * 1'   # 週 1 回: 実 API の契約テスト
  workflow_dispatch:

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test(ライブラリ・ゴールデン画像)
        run: |
          dotnet test --project tests/Weather.Core.Tests
          dotnet test --project tests/Weather.Providers.Tests
          dotnet test --project tests/Weather.Geo.Tests
          dotnet test --project tests/Weather.Scene.Tests
          dotnet test --project tests/Weather.Rendering.Tests
          dotnet test --project tests/Weather.Infrastructure.Tests
          dotnet test --project tests/Weather.Presentation.Tests

  build-android:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet workload install maui-android
      - run: dotnet build src/Weather.App/Weather.App.csproj -f net10.0-android -warnaserror

  build-ios:
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Xcode の選択(iOS ワークロードが要求する最新版)
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - run: dotnet workload install maui-ios
      - run: dotnet build src/Weather.App/Weather.App.csproj -f net10.0-ios -p:EnableCodeSigning=false

  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: 実 API の契約テスト
        run: dotnet test --project tests/Weather.Providers.LiveTests -- --explicit only
